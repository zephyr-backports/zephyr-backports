# flatpak-builder manifest for the Zephyr desktop wallet as built by the zephyr-wallet security fork.
# It repackages the deb that the `desktop-linux` job of the same tag produced (the fork's
# .github/workflows/build-wallet.yml downloads that artefact and copies it here as zephyr.deb);
# nothing is rebuilt and the fork's build config is not touched (upstream's maker-flatpak is disabled,
# electron-forge issue #2561).
#
# Runtime choice: org.freedesktop.Platform 26.08 with org.electronjs.Electron2.BaseApp 26.08,
# the newest YY.08 branch present in both, from a read-only `git ls-remote --heads` on 2026-11-05:
#   flathub/org.electronjs.Electron2.BaseApp: branch/18.08 … branch/26.08 (plus branch/stable)
#   freedesktop-sdk/freedesktop-sdk:          release/20.08 … release/26.08
# Electron 22 ships prebuilt binaries that need glibc, GTK 3, NSS, ALSA/PulseAudio client
# libraries and X11 (Chromium 108 defaults to X11; Wayland only behind ozone flags). The
# freedesktop runtime provides those, and the Electron BaseApp adds zypak (Chromium sandbox
# inside flatpak), libsecret and libnotify. Not verified that Electron 22 runs on 26.08:
# flatpak-builder is not installed on the workstation; the first CI run decides, with 25.08 as
# the step back.
#
# Checked against the deb of tag v2.3.0-sec.1 built on 2026-11-07 (zephyr_2.3.0_amd64.deb, electron-forge's
# maker-deb with electron-installer-debian 3.2.0, on the workstation):
#   - app tree /usr/lib/zephyr with the binary /usr/lib/zephyr/zephyr (asar off), /usr/bin/zephyr ->
#     ../lib/zephyr/zephyr, icon /usr/share/pixmaps/zephyr.png (PNG 256x256), desktop file
#     /usr/share/applications/zephyr.desktop (Name=zephyr, Exec=zephyr %U, Icon=zephyr); no other icon sizes;
#   - every build command below was run as a shell script against that deb with /app replaced by a scratch
#     directory: all succeed, and the edited desktop file passes desktop-file-validate.
# Not checked: the flatpak build itself (flatpak-builder is not installed on the workstation), the runtime
# 26.08 for Electron 22, the finish-args. The files of /usr/lib/zephyr/resources/app keep the modes of the
# tree the deb was built from (`cp -a`): the deb must be built with umask 0022 throughout, or the app is not
# readable for other users inside the flatpak either.
app-id: dev.lateo.zephyr
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
base: org.electronjs.Electron2.BaseApp
base-version: '26.08'
command: zephyr-wallet
separate-locales: false
finish-args:
  - --share=ipc
  - --socket=x11
  - --device=dri
  - --socket=pulseaudio            # Chromium opens an audio client even when unused (estimate; drop if not needed)
  - --share=network                # remote nodes and the price feed
  - --filesystem=xdg-download      # the wallet saves .keys files; Electron 22's save dialog writes there
  - --talk-name=org.freedesktop.Notifications
modules:
  - name: zephyr-wallet
    buildsystem: simple
    sources:
      - type: file
        path: zephyr.deb
      - type: script
        dest-filename: zephyr-wallet.sh
        commands:
          - exec zypak-wrapper /app/lib/zephyr/zephyr "$@"
    build-commands:
      - ar x zephyr.deb
      - tar -xf data.tar.*
      - mkdir -p /app/lib
      - cp -a usr/lib/zephyr /app/lib/zephyr
      - install -Dm755 zephyr-wallet.sh /app/bin/zephyr-wallet
      - install -Dm644 usr/share/pixmaps/zephyr.png /app/share/icons/hicolor/256x256/apps/dev.lateo.zephyr.png
      - install -Dm644 usr/share/applications/zephyr.desktop /app/share/applications/dev.lateo.zephyr.desktop
      - desktop-file-edit --set-key=Exec --set-value='zephyr-wallet %U' --set-icon=dev.lateo.zephyr /app/share/applications/dev.lateo.zephyr.desktop
