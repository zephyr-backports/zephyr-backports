# Reusable workflow (workflow_call) for the security forks: checks that every commit above the
# upstream tag is a `git cherry-pick -x` from the fork's upstream branch or an allowed own commit,
# using tools/check-provenance.sh from this repo. Forks call it from their own
# .github/workflows/provenance.yml (see fork-files/zephyr/).
name: provenance (reusable)
on:
  workflow_call:
jobs:
  provenance:
    runs-on: ubuntu-latest
    steps:
      - name: checkout fork (on a pull request: its head, not GitHub's synthetic merge commit)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: checkout tooling
        uses: actions/checkout@v4
        with:
          repository: zephyr-backports/zephyr-backports
          path: .zephyr-backports
      - name: fetch the fork's upstream branch and the base tag
        run: |
          case "${GITHUB_REPOSITORY#*/}" in
            zephyr-cpp)        echo "UP_REMOTE=monero-cpp" >> "$GITHUB_ENV"; echo "UP_URL=https://github.com/woodser/monero-cpp.git" >> "$GITHUB_ENV"; echo "UP_BRANCH=master" >> "$GITHUB_ENV";;
            zephyr-javascript) echo "UP_REMOTE=monero-ts" >> "$GITHUB_ENV"; echo "UP_URL=https://github.com/woodser/monero-ts.git" >> "$GITHUB_ENV"; echo "UP_BRANCH=master" >> "$GITHUB_ENV";;
            zephyr-wallet)     echo "UP_REMOTE=haven" >> "$GITHUB_ENV"; echo "UP_URL=https://github.com/haven-protocol-org/haven-web-app.git" >> "$GITHUB_ENV"; echo "UP_BRANCH=master" >> "$GITHUB_ENV";;
            *)                 echo "UP_REMOTE=monero" >> "$GITHUB_ENV"; echo "UP_URL=https://github.com/monero-project/monero.git" >> "$GITHUB_ENV"; echo "UP_BRANCH=release-v0.18 master" >> "$GITHUB_ENV";;
          esac
          # The base is the upstream tag the security branch is named after. The forks carry no
          # upstream tags on GitHub (only v*-sec.* tags are pushed), so the tag comes from the branch
          # name: the PR's base branch, or the pushed branch itself; a push to any other branch falls
          # back to the newest upstream v* tag that is an ancestor.
          UP_TAGS=https://github.com/ZephyrProtocol/${GITHUB_REPOSITORY#*/}.git
          if [ -f .github/upstream-base ]; then
            ref=$(tr -d ' \n' < .github/upstream-base)   # forks without upstream tags pin the base commit here
          else
            ref=""
            case "${GITHUB_BASE_REF:-}" in security/*) ref="${GITHUB_BASE_REF#security/}";; esac
            [ -n "$ref" ] || case "${GITHUB_REF_NAME:-}" in security/*) ref="${GITHUB_REF_NAME#security/}";; esac
            if [ -n "$ref" ]; then
              git fetch --no-tags "$UP_TAGS" "refs/tags/$ref:refs/tags/$ref"
            else
              git fetch --no-tags "$UP_TAGS" 'refs/tags/v*:refs/tags/v*'
              ref=$(git describe --tags --abbrev=0 --match 'v*' --exclude '*-sec.*')
            fi
          fi
          echo "BASE_TAG=$ref" >> "$GITHUB_ENV"
      - name: check provenance (upstream per fork via UP_REMOTE/UP_URL/UP_BRANCH)
        run: bash .zephyr-backports/tools/check-provenance.sh . "$BASE_TAG"
